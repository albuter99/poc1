name: Spanish corpus machine translation 6000 drafts
on:
  push:
    branches:
      - prototype-excel-multilingue-es-en
    paths:
      - '.github/workflows/translate-6000-es.yml'
      - 'scripts/translate_6000_es.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: poc1-shared-translations
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout experimental branch with write credentials
        uses: actions/checkout@v4
        with:
          ref: prototype-excel-multilingue-es-en
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install French-Spanish translation model runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'transformers==4.44.2' sentencepiece sacremoses torch
      - name: Set Git checkpoint identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Translate 6000 new unique structured maillons into Spanish proposals
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/translate_6000_es.py --target 6000 --checkpoint 250 --push
      - name: Verify Spanish translation checkpoint output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data/spanish-translation-progress.json").read_text(encoding="utf-8"))
          assert p["completed_new"]==6000, p["completed_new"]
          assert len(p["checkpoint_history"])>=24
          print("6000 Spanish machine proposals generated, NOT legally validated")
          PY
      - name: Refresh experimental Pages only after successful completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
