name: Save reference chain and refresh Pages
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: poc1-save-chain
  cancel-in-progress: false
jobs:
  save:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[Poc1] Nouvelle chaîne')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validate issue and append chain
        id: append
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/import_issue.py
      - name: Commit and push data
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chains.json
          git commit -m "Add reference chain from issue #${ISSUE_NUMBER}"
          git push origin HEAD:main
      - name: Compute statistics using Python
        run: python3 scripts/build_stats.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Confirm and close issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          NEW_ID: ${{ steps.append.outputs.new_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Chaîne $NEW_ID enregistrée dans data/chains.json. Analyses Python recalculées et site publié. Actualisez Poc1 pour consulter les données."
          gh issue close "$ISSUE_NUMBER" --reason completed
      - name: Explain failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ La demande n'a pas pu être finalisée. Consultez les journaux de l'action GitHub avant de réessayer. La chaîne peut ne pas avoir été publiée."
