name: Experimental branch final checks

on:
  push:
    branches:
      - prototype-excel-multilingue-es-en
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify corpus integrity and ES EN UI translations
        run: python tests/test_final.py
