name: Validate corpus segmentation
on:
  push:
    branches:
      - prototype-excel-multilingue-es-en
    paths:
      - 'data/excel-indexations-*.json'
      - 'data/excel-manifest.json'
      - 'scripts/check_corpus_segments.py'
      - 'tests/test_final.py'
      - 'data/segmentation-audit.json'
      - 'data/normalized-term-translations.json'
      - 'i18n.js'
      - 'branch-data.js'
      - '.github/workflows/validate-segments.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate current structured indexing corpus and maillons
        run: python scripts/check_corpus_segments.py
      - name: Run final application and data consistency tests
        run: python tests/test_final.py
