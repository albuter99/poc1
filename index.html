rols{display:flex;justify-content:space-between;gap:12px;margin-top:30px}.controls .right{display:flex;gap:10px}.term-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}.term-box{border:1px solid #dbe3ee;border-radius:10px;padding:12px;min-height:290px;max-height:355px;overflow:auto}.term-box input{width:100%;margin-bottom:10px}.term-row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px 4px;border-bottom:1px solid #f0f2f6;font-size:13px}.term-row button{border:1px solid #cddbf0;background:#edf4ff;color:#28548d;border-radius:7px;width:29px;height:27px}.term-row button.remove{background:#fff2f2;color:#a43838;border-color:#f5cccc}.summary{background:#f6f9fd;border:1px solid #e0e8f2;border-radius:10px;padding:17px;margin-top:16px}.summary dt{font-size:12px;font-weight:700;color:#708099;margin:0 0 5px}.summary dd{margin:0 0 15px;line-height:1.6;overflow-wrap:anywhere}.summary dd:last-child{margin:0}.success{text-align:center;padding:35px 0}.success .symbol{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:#e4f6eb;color:#247749;display:grid;place-items:center;font-size:34px}.footnote{margin-top:24px;text-align:center;font-size:12px;color:#8190a2}.error{color:#b44545;font-size:13px;margin-top:10px}.hidden{display:none!important}@media(max-width:760px){main{padding:23px 15px}.grid{grid-template-columns:repeat(2,1fr)}.panels,.term-cols{grid-template-columns:1fr}.heading{align-items:flex-start}h1{font-size:25px}.wizard .panel{padding:20px}.appbar{padding:15px}.top-pill{display:none}}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:9px}.card{padding:14px}.card .num{font-size:26px}.heading{flex-direction:column}.heading button{align-self:stretch}}

<script>
"use strict";
const STORAGE="poc1-reference-chains-v1";
const LOCALE_KEY="poc1-ui-language";
let uiLang="fr";try{const v=localStorage.getItem(LOCALE_KEY);if(v&&I18N_NAMES[v])uiLang=v}catch(_){}
const extraTerms=["Conditions","Marge de l’appréciation de l’Office","Mesures d'instruction","Motivation des décisions","Objectif","Portée","Notification","Notion","Procédure d’opposition","Procédure de nullité","Recevabilité","Délai de recours","Charge de la preuve","Droits de la défense","Examen d'office","Décision définitive","Appréciation des preuves","Motivation juridique","Protection juridictionnelle","Intérêt à agir","Principes généraux","Contrôle de légalité","Compétence de l'Office","Mesures provisoires","Erreur manifeste","Irrecevabilité","Droits antérieurs","Caractère distinctif","Risque de confusion","Usage sérieux","Opposabilité","Protection des données","Publication","Déchéance","Réexamen","Délai de prescription","Règles de procédure","Recours en annulation","Proportionnalité","Sécurité juridique"];
const state={records:[],pendingUrl:"",view:"dashboard",step:1,base:"",terms:[],date:"",endDate:"3000-12-31",search:"",status:"all",indexFilter:"all",treeIndexFilter:"all",wizardIndexFilter:"all",wizardTreeSearch:"",indexationTypes:[],indexationLookup:{},typeIndexation:"",termSearch:"",selectedSearch:"",error:"",lastSaved:null};
const el=document.getElementById("app");
let treePaths=[];
function typeOf(rec){return rec.type_indexation||state.indexationLookup[rec.id]||"Non renseigné"}
function typeOptions(selected){return '<option value="all">Tous les types d’indexation</option>'+state.indexationTypes.map(t=>'<option value="'+esc(t)+'" '+(selected===t?"selected":"")+'>'+esc(t)+'</option>').join("")}
function filteredByIndexation(arr,type){return type==="all"?arr:arr.filter(c=>typeOf(c)===type)}
function buildTree(records){const root={name:"",path:"",children:new Map(),count:0};for(const rec of records){const full=rec.full_chain_label||rec.base_chain||"";let current=root;for(const piece of full.split(" - ").filter(Boolean)){if(!current.children.has(piece)){const path=current.path?current.path+" - "+piece:piece;current.children.set(piece,{name:piece,path,children:new Map(),count:0})}current=current.children.get(piece);current.count++}}return root}
function treeMarkup(records,mode){treePaths=[];const tree=buildTree(records);function draw(node){const i=treePaths.push(node.path)-1;const button='<button type="button" class="tree-pick" data-tree-index="'+i+'" title="'+(mode==="wizard"?"Choisir ce niveau":"Afficher cette branche")+'" aria-label="Sélectionner : '+esc(node.path)+'">'+esc(node.name)+'</button>';const badge='<small class="tree-count">'+node.count+'</small>';if(!node.children.size)return '<div class="tree-leaf" data-path-index="'+i+'">'+button+badge+'</div>';return '<details class="tree-branch"><summary><span class="tree-name">'+button+badge+'</span></summary><div class="tree-children">'+[...node.children.values()].sort((a,b)=>a.name.localeCompare(b.name,"fr")).map(draw).join("")+'</div></details>'}return '<div class="tree-wrapper">'+[...tree.children.values()].sort((a,b)=>a.name.localeCompare(b.name,"fr")).map(draw).join("")+'</div>'}
function treeFilters(mode){const type=mode==="wizard"?state.wizardIndexFilter:state.treeIndexFilter;const q=mode==="wizard"?state.wizardTreeSearch:"";return '<div class="toolbar tree-filters"><input type="search" id="tree-search" aria-label="Rechercher dans l’arborescence" placeholder="Rechercher une chaîne ou un terme…" value="'+esc(q)+'"><select id="tree-type" aria-label="Filtrer par type d’indexation">'+typeOptions(type)+'</select></div>'}
function filterTree(query){const q=query.trim().toLocaleLowerCase("fr");const wrap=document.querySelector(".tree-wrapper");if(!wrap)return;const nodes=[...wrap.querySelectorAll(".tree-branch,.tree-leaf")];for(const n of nodes){const b=n.classList.contains("tree-leaf")?n.querySelector(":scope > .tree-pick"):n.querySelector(":scope > summary .tree-pick");if(!b)continue;const path=treePaths[Number(b.dataset.treeIndex)]||"";const p=path.toLocaleLowerCase("fr");const matches=!q||p.includes(q)||treePaths.some(t=>t.toLocaleLowerCase("fr").startsWith(p+" - ")&&t.toLocaleLowerCase("fr").includes(q));n.style.display=matches?"":"none";if(q&&matches&&n.classList.contains("tree-branch"))n.open=true;if(!q&&n.classList.contains("tree-branch"))n.open=false}const msg=document.getElementById("tree-empty");if(msg)msg.hidden=nodes.some(n=>n.classList.contains("tree-leaf")&&n.style.display!=="none")}
function bindTree(mode){document.querySelectorAll(".tree-pick").forEach(b=>{b.onclick=e=>{e.preventDefault();e.stopPropagation();const path=treePaths[Number(b.dataset.treeIndex)];if(mode==="wizard"){state.base=path;state.terms=[];state.error="";const match=filteredByIndexation(state.records,state.wizardIndexFilter).find(x=>x.full_chain_label===path||x.full_chain_label.startsWith(path+" - "));state.typeIndexation=match?typeOf(match):state.typeIndexation;document.querySelectorAll(".tree-pick").forEach(x=>x.classList.toggle("picked",x===b));const current=document.getElementById("tree-selection");if(current)current.textContent=path;document.querySelector(".error")?.remove()}else{state.search=path;dashboard()}}});
const search=document.getElementById("tree-search"),type=document.getElementById("tree-type");if(search)search.oninput=e=>{if(mode==="wizard")state.wizardTreeSearch=e.target.value;filterTree(e.target.value)};if(type)type.onchange=e=>{if(mode==="wizard"){state.wizardIndexFilter=e.target.value;state.typeIndexation=e.target.value==="all"?"":e.target.value;wizard()}else{state.treeIndexFilter=e.target.value;dashboard()}};if(search&&search.value)filterTree(search.value)}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(x){if(!x)return "Non renseignée";const [y,m,d]=x.split("-");return d+"/"+m+"/"+y}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state.records));return true}catch(e){console.warn("Stockage indisponible",e);return false}}
async function init(){try{try{const mr=await fetch("./data/graph-relations.json",{cache:"no-store"});if(mr.ok){const md=await mr.json();state.indexationLookup=Object.fromEntries(Object.entries(md.relations||{}).map(([k,v])=>[k,v.type_indexation]));state.indexationTypes=[...new Set(md.types||Object.values(state.indexationLookup))].filter(Boolean)}}catch(e){console.warn("Indexation metadata unavailable",e)}const r=await fetch("./data/chains.json",{cache:"no-store"});if(!r.ok)throw Error("Dataset indisponible");const seed=await r.json();let stored=null;try{stored=JSON.parse(localStorage.getItem(STORAGE))}catch(e){}if(!Array.isArray(stored))stored=[];const known=new Set(seed.map(x=>x.full_chain_label));const extras=stored.filter(x=>x&&x.full_chain_label&&!known.has(x.full_chain_label));const used=new Set(seed.map(x=>x.id));const local=extras.map((x,i)=>{let id=x.id;if(!id||used.has(id))id="LOCAL-"+String(i+1).padStart(4,"0");used.add(id);return {...x,id,status:"Active",local_only:true}});state.records=[...seed,...local];state.indexationTypes=[...new Set([...state.indexationTypes,...state.records.map(typeOf)])].sort((a,b)=>a.localeCompare(b,"fr"));save()}catch(e){try{state.records=JSON.parse(localStorage.getItem(STORAGE))||[]}catch(_){}state.error="Les données initiales n’ont pas pu être chargées."}render()}
function shell(body){const options=Object.entries(I18N_NAMES).map(([code,name])=>'<option value="'+code+'" '+(uiLang===code?"selected":"")+'>'+esc(name)+'</option>').join("");el.innerHTML='<div class="appbar"><div class="brand">MDM - Gestion de chaînes de référence<small>PROOF OF CONCEPT · DONNÉES FICTIVES</small></div><div class="locale-controls"><label for="lang-select" class="locale-label">🌐</label><select id="lang-select" aria-label="Language / Langue" title="Language / Langue">'+options+'</select><span class="top-pill">Environnement de démonstration</span></div></div><main>'+body+'</main>';document.getElementById("lang-select").onchange=e=>{uiLang=e.target.value;try{localStorage.setItem(LOCALE_KEY,uiLang)}catch(_){}render()}}
function dashboard(){
const a=state.records,q=state.search.toLocaleLowerCase("fr"),filtered=a.filter(x=>(!q||[x.full_chain_label,x.id,x.base_chain].join(" ").toLocaleLowerCase("fr").includes(q))&&(state.status==="all"||x.status===state.status)&&(state.indexFilter==="all"||typeOf(x)===state.indexFilter)).sort((a,b)=>String(b.created_at||"").localeCompare(String(a.created_at||"")));
const treeData=filteredByIndexation(a,state.treeIndexFilter);
shell('<div class="heading"><div><h1>Tableau de bord</h1><p>Vue d’ensemble des chaînes de référence</p></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" id="explore-graph">◉ Graphe interactif</button><button class="btn primary" id="add"><span class="plus">+</span> Nouvelle chaîne</button></div></div>'+
'<section class="analytics-section" id="analytics-host"><p>Chargement des statistiques Python…</p></section>'+
'<section class="panel" style="margin-bottom:18px"><header><h2>Explorer les chaînes par arborescence</h2><span class="subtle">Recherche et type d’indexation</span></header>'+treeFilters("dashboard")+treeMarkup(treeData,"dashboard")+'<p id="tree-empty" class="empty" '+(treeData.length?"hidden":"") +'>Aucune chaîne ne correspond à cette recherche.</p></section>'+
'<section class="panel"><header><h2>Répertoire des chaînes de référence</h2><span class="subtle">'+filtered.length+' résultat(s)</span></header><div class="toolbar"><input id="global-search" placeholder="Rechercher une chaîne, un terme, un identifiant…" value="'+esc(state.search)+'"><select id="index-filter" aria-label="Type d’indexation">'+typeOptions(state.indexFilter)+'</select><select id="status"><option value="all">Tous les statuts</option><option value="Active" '+(state.status==="Active"?"selected":"")+'>Actives</option><option value="Brouillon" '+(state.status==="Brouillon"?"selected":"")+'>Brouillons</option></select><button class="btn sm" id="export">Exporter CSV</button></div>'+
'<div class="table-wrap"><table><thead><tr><th>Identifiant</th><th>Chaîne de référence</th><th>Type d’indexation</th><th>Date de création</th><th>Date de début</th><th>Date de fin</th><th>Date de défaut</th><th>Statut</th><th>Relations</th></tr></thead><tbody>'+
filtered.map(x=>'<tr><td><strong>'+esc(x.id)+'</strong></td><td>'+esc(x.full_chain_label)+'</td><td>'+esc(typeOf(x))+'</td><td>'+fmtDate((x.created_at||"").slice(0,10))+'</td><td>'+fmtDate(x.validity_start_date||"1900-01-01")+'</td><td>'+fmtDate(!x.validity_end_date||x.validity_end_date==="1900-01-01"?"3000-12-31":x.validity_end_date)+'</td><td>'+(x.default_date?fmtDate(x.default_date):"")+'</td><td><span class="tag '+(x.status==="Brouillon"?"gray":"")+'">'+esc(x.status)+'</span></td><td><button class="btn sm graph-open" data-graph-id="'+esc(x.id)+'" title="Explorer les relations">◉ Graphe</button></td></tr>').join("")+
'</tbody></table>'+(filtered.length?"":'<div class="empty">Aucun résultat</div>')+'</div></section><div class="footnote">Données fictives. Sauvegarde locale automatique sur cet appareil.</div>');
window.PocAnalytics?.render(state.records);bindTree("dashboard");
document.getElementById("explore-graph").onclick=()=>window.PocGraph?.open(state.records);
document.getElementById("add").onclick=()=>{state.view="wizard";state.step=1;state.base="";state.terms=[];state.date="1900-01-01";state.endDate="3000-12-31";state.typeIndexation="";state.wizardIndexFilter="all";state.wizardTreeSearch="";state.error="";render()};
document.getElementById("global-search").oninput=e=>{const pos=e.target.selectionStart;state.search=e.target.value;dashboard();const n=document.getElementById("global-search");n.focus();n.setSelectionRange(pos,pos)};
document.getElementById("status").onchange=e=>{state.status=e.target.value;dashboard()};
document.getElementById("index-filter").onchange=e=>{state.indexFilter=e.target.value;dashboard()};
document.getElementById("export").onclick=exportCSV;
document.querySelectorAll("[data-graph-id]").forEach(b=>b.onclick=()=>window.PocGraph?.open(state.records,b.dataset.graphId))
}
function exportCSV(){const cols=["id","root","base_chain","selected_terms","full_chain_label","type_indexation","validity_start_date","validity_end_date","created_at","default_date","status"];const csv=[cols.join(";"),...state.records.map(x=>cols.map(k=>'"'+String(k==="selected_terms"?(x[k]||[]).join(" | "):x[k]??"").replaceAll('"','""')+'"').join(";"))].join("\r\n");const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="chaines-reference-poc1.csv";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function wizard(){const titles=["Type de création","Sélection de la chaîne de base","Sélection des termes","Vérifiez et validez","Sauvegarde"];const body='<button class="btn sm" id="quit">← Tableau de bord</button><div class="wizard"><h1>Créer une chaîne de référence</h1><p>Étape '+state.step+' sur 5 · '+titles[state.step-1]+'</p><div class="stepper">'+titles.map((x,i)=>'<span class="'+(i<state.step?"on":"")+'" title="'+esc(x)+'"></span>').join("")+'</div><section class="panel"><h2>'+titles[state.step-1]+'</h2>'+stepBody()+'</section><div class="footnote">Toutes les données sont fictives. Cette démonstration ne modifie aucun système institutionnel.</div></div>';shell(body);document.getElementById("quit").onclick=()=>{state.view="dashboard";render()};bindStep()}
function buttons(last){return '<div class="controls"><button class="btn" id="back">'+(state.step===1?"Annuler":"Précédent")+'</button><div class="right"><button class="btn primary" id="next">'+last+'</button></div></div>'}
function stepBody(){if(state.step===1)return '<p>Choisissez une méthode de création.</p><label class="choice disabled"><input type="radio" disabled name="mode"><span><strong>À partir d’un terme de niveau 1</strong><small>Fonctionnalité à venir</small></span></label><label class="choice"><input type="radio" checked name="mode"><span><strong>À partir d’une chaîne de référence existante</strong><small>Créer une nouvelle chaîne en ajoutant des termes à une chaîne existante.</small></span></label>'+buttons("Suivant");
if(state.step===2){const subset=filteredByIndexation(state.records,state.wizardIndexFilter);return '<p>Choisissez une chaîne existante dans l’arborescence.</p>'+treeFilters("wizard")+'<div class="field"><label>Arborescence des chaînes de référence</label>'+treeMarkup(subset,"wizard")+'<p id="tree-empty" class="empty" '+(subset.length?"hidden":"")+'>Aucune chaîne ne correspond à cette recherche.</p></div><div class="summary"><dt>Chaîne sélectionnée</dt><dd id="tree-selection">'+esc(state.base||"Aucune sélection")+'</dd></div>'+err()+buttons("Suivant")}

if(state.step===3){const available=extraTerms.filter(x=>!state.terms.includes(x)&&x.toLocaleLowerCase("fr").includes(state.termSearch.toLocaleLowerCase("fr")));const chosen=state.terms.filter(x=>x.toLocaleLowerCase("fr").includes(state.selectedSearch.toLocaleLowerCase("fr")));return '<p>Ajoutez les termes dans l’ordre souhaité. La chaîne finale reprend la chaîne de base sélectionnée.</p><div class="summary"><dt>Chaîne de référence</dt><dd>'+esc(state.base)+'</dd></div><div class="field"><label for="date">Date début validité</label><input type="date" id="date" value="'+esc(state.date||"1900-01-01")+'"></div><div class="field"><label for="end-date">Date de fin</label><input type="date" id="end-date" value="'+esc(state.endDate||"3000-12-31")+'"></div><div class="field"><label for="new-type-indexation">Type d’indexation</label><select id="new-type-indexation" style="width:100%">'+state.indexationTypes.map(t=>'<option value="'+esc(t)+'" '+(state.typeIndexation===t?"selected":"")+'>'+esc(t)+'</option>').join("")+'</select></div><div class="term-cols"><div><h3>Termes disponibles</h3><input id="term-search" placeholder="Rechercher…" value="'+esc(state.termSearch)+'"><div class="term-box">'+available.map(t=>'<div class="term-row"><span>'+esc(t)+'</span><button data-add="'+esc(t)+'" title="Ajouter">+</button></div>').join("")+(available.length?"":'<p>Aucun terme disponible</p>')+'</div></div><div><h3>Termes sélectionnés ('+state.terms.length+')</h3><input id="chosen-search" placeholder="Rechercher…" value="'+esc(state.selectedSearch)+'"><div class="term-box">'+chosen.map((t)=>{const idx=state.terms.indexOf(t);return '<div class="term-row selected-term" draggable="true" data-term-index="'+idx+'"><span class="term-label"><span class="drag-handle" aria-hidden="true">⠿</span><span class="order-number">'+(idx+1)+'.</span> '+esc(t)+'</span><div class="reorder-actions"><button class="move-btn" data-move-up="'+idx+'" title="Monter ce terme" aria-label="Monter '+esc(t)+'" '+(idx===0?"disabled":"")+'>↑</button><button class="move-btn" data-move-down="'+idx+'" title="Descendre ce terme" aria-label="Descendre '+esc(t)+'" '+(idx===state.terms.length-1?"disabled":"")+'>↓</button><button class="remove" data-remove="'+esc(t)+'" title="Retirer '+esc(t)+'" aria-label="Retirer '+esc(t)+'">×</button></div></div>'}).join("")+(chosen.length?"":'<p>Aucun terme sélectionné</p>')+'</div><p class="reorder-hint">Glissez-déposez les termes ou utilisez ↑ et ↓ pour changer leur ordre.</p></div></div>'+err()+buttons("Suivant")}
if(state.step===4||state.step===5){const full=state.base+(state.terms.length?" - "+state.terms.join(" - "):"");return '<p>'+(state.step===4?"Vérifiez les éléments de la nouvelle chaîne et validez.":"Confirmez la sauvegarde dans le répertoire des chaînes de référence.")+'</p><dl class="summary"><dt>Chaîne de référence</dt><dd>'+esc(full)+'</dd><dt>Date de début</dt><dd>'+fmtDate(state.date)+'</dd><dt>Date de fin</dt><dd>'+fmtDate(state.endDate||"3000-12-31")+'</dd><dt>Liste des termes</dt><dd><ol style="padding-left:20px;margin:5px 0">'+state.base.split(" - ").concat(state.terms).map(t=>'<li>'+esc(t)+'</li>').join("")+'</ol></dd></dl>'+buttons(state.step===4?"Valider":"Sauvegarder")}}
function err(){return state.error?'<p class="error" role="alert">'+esc(state.error)+'</p>':""}
function bindStep(){document.getElementById("back").onclick=()=>{state.error="";if(state.step===1){state.view="dashboard"}else{state.step--}render()};document.getElementById("next").onclick=next;if(state.step===2){bindTree("wizard");}if(state.step===3){document.getElementById("date").onchange=e=>state.date=e.target.value;document.getElementById("end-date").onchange=e=>state.endDate=e.target.value||"3000-12-31";document.getElementById("new-type-indexation").onchange=e=>state.typeIndexation=e.target.value;document.getElementById("term-search").oninput=e=>{state.termSearch=e.target.value;wizard();document.getElementById("term-search").focus()};document.getElementById("chosen-search").oninput=e=>{state.selectedSearch=e.target.value;wizard();document.getElementById("chosen-search").focus()};document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{if(!state.terms.includes(b.dataset.add))state.terms.push(b.dataset.add);state.error="";wizard()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{state.terms=state.terms.filter(t=>t!==b.dataset.remove);wizard()});function moveTerm(from,to){if(from<0||to<0||from>=state.terms.length||to>=state.terms.length||from===to)return;const term=state.terms.splice(from,1)[0];state.terms.splice(to,0,term);wizard()}document.querySelectorAll("[data-move-up]").forEach(b=>b.onclick=()=>moveTerm(Number(b.dataset.moveUp),Number(b.dataset.moveUp)-1));document.querySelectorAll("[data-move-down]").forEach(b=>b.onclick=()=>moveTerm(Number(b.dataset.moveDown),Number(b.dataset.moveDown)+1));let dragFrom=null;document.querySelectorAll(".selected-term").forEach(row=>{row.addEventListener("dragstart",e=>{dragFrom=Number(row.dataset.termIndex);row.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(dragFrom))});row.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";row.classList.add("drag-over")});row.addEventListener("dragleave",()=>row.classList.remove("drag-over"));row.addEventListener("drop",e=>{e.preventDefault();const from=dragFrom;dragFrom=null;moveTerm(from,Number(row.dataset.termIndex))});row.addEventListener("dragend",()=>{dragFrom=null;document.querySelectorAll(".selected-term").forEach(x=>x.classList.remove("dragging","drag-over"))})})}}
function next(){state.error="";if(state.step===2&&!state.base){state.error="Veuillez sélectionner une chaîne de base.";return render()}if(state.step===3){state.date=document.getElementById("date").value;state.endDate=document.getElementById("end-date").value||"1900-01-01";if(!state.date){state.error="Veuillez renseigner la date de début de validité.";return render()}if(!state.terms.length){state.error="Veuillez sélectionner au moins un terme.";return render()}}if(state.step===5)return commit();state.step++;render()}
function commit(){
 const full=state.base+" - "+state.terms.join(" - ");
 if(state.records.some(x=>x.full_chain_label===full)){state.error="Cette chaîne existe déjà.";state.step=4;render();return}
 const next=Math.max(0,...state.records.map(x=>Number((String(x.id).match(/^REF-(\d+)$/)||[])[1])||0));
 const item={id:"REF-"+String(next+1).padStart(4,"0"),root:state.base.split(" - ")[0],base_chain:state.base,selected_terms:[...state.terms],full_chain_label:full,validity_start_date:state.date||"1900-01-01",validity_end_date:state.endDate||"3000-12-31",type_indexation:state.typeIndexation||state.indexationTypes[0]||"Non renseigné",created_at:new Date().toISOString(),status:"Active",local_only:true};
 state.records.push(item);
 if(!save()){state.records.pop();state.error="Enregistrement local impossible : stockage du navigateur indisponible.";state.step=4;render();return}
 state.lastSaved=item;state.view="success";render()
}
function success(){shell('<div class="wizard"><section class="panel success"><div class="symbol">✓</div><h1>Chaîne sauvegardée</h1><p>La chaîne <strong>'+esc(state.lastSaved.id)+'</strong> a été enregistrée. Elle est disponible dans le répertoire, l’arborescence et le graphe. Les statistiques seront recalculées à l’ouverture du tableau de bord.</p><div class="summary" style="text-align:left">'+esc(state.lastSaved.full_chain_label)+'</div><p style="font-size:12px;margin-top:16px">Mode démonstration : les modifications ne sont pas partagées avec d’autres appareils. Aucune demande GitHub n’est nécessaire.</p><button class="btn primary" id="home" style="margin-top:24px">Revenir au tableau de bord</button></section></div>');document.getElementById("home").onclick=()=>{state.view="dashboard";state.search="";state.status="all";render()}}
function translateUI(){document.documentElement.lang=uiLang;const dict=I18N_TRANSLATIONS[uiLang]||{};const root=document.getElementById("app");const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){if(n.parentElement?.closest(".tree-wrapper,.term-row,.summary dd,tbody"))continue;const value=n.nodeValue;const trimmed=value.trim();const match=/^Termes sélectionnés \((\d+)\)$/.exec(trimmed);if(match&&dict["Termes sélectionnés"]){n.nodeValue=value.replace(trimmed,dict["Termes sélectionnés"]+" ("+match[1]+")");continue}if(dict[trimmed])n.nodeValue=value.replace(trimmed,dict[trimmed])}for(const input of root.querySelectorAll("input[placeholder]")){const value=input.getAttribute("placeholder");if(dict[value])input.setAttribute("placeholder",dict[value])}const stepNames={bg:["Стъпка","от"],cs:["Krok","z"],da:["Trin","af"],de:["Schritt","von"],el:["Βήμα","από"],en:["Step","of"],es:["Paso","de"],et:["Samm","/"],fi:["Vaihe","/"],ga:["Céim","as"],hr:["Korak","od"],hu:["Lépés","/"],it:["Passaggio","di"],lt:["Žingsnis","iš"],lv:["Solis","no"],mt:["Pass","minn"],nl:["Stap","van"],pl:["Krok","z"],pt:["Passo","de"],ro:["Pasul","din"],sk:["Krok","z"],sl:["Korak","od"],sv:["Steg","av"]};const heading=root.querySelector(".wizard > p");if(heading){const match=/^Étape (\\d+) sur 5 · (.*)$/.exec(heading.textContent);if(match&&stepNames[uiLang])heading.textContent=stepNames[uiLang][0]+" "+match[1]+" "+stepNames[uiLang][1]+" 5 · "+(dict[match[2]]||match[2])}}
const originalDashboard=dashboard;dashboard=function(){originalDashboard();translateUI()};
const originalWizard=wizard;wizard=function(){originalWizard();translateUI()};
const originalSuccess=success;success=function(){originalSuccess();translateUI()};
function render(){if(state.view==="dashboard")dashboard();else if(state.view==="success")success();else wizard()}
init();
</script></body></html>
