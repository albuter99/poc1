<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion de chaînes de référence | Proof of Concept</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#192437;background:#f5f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.appbar{background:#14253f;color:#fff;padding:17px max(24px,calc((100vw - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:750;letter-spacing:.15px;font-size:19px}.brand small{display:block;color:#aec3de;font-weight:400;font-size:11px;letter-spacing:1.5px;margin-top:5px}.top-pill{border:1px solid #54718c;border-radius:40px;color:#dce7f6;padding:6px 12px;font-size:12px}main{max-width:1240px;margin:auto;padding:34px 24px 70px}.heading{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:29px;margin:0 0 8px;font-weight:750;letter-spacing:-.6px}h2{font-size:18px;margin:0 0 12px}p{margin:0;color:#64738b;line-height:1.55}.btn{border:1px solid #c7d2e2;background:white;border-radius:9px;padding:11px 17px;color:#21334e;font-weight:650}.btn:hover:not(:disabled){filter:brightness(.96)}.primary{background:#2b5ba9;color:white;border-color:#2b5ba9}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sm{padding:8px 11px}.plus{font-size:23px;vertical-align:-2px;margin-right:6px;font-weight:400}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid #e1e7f0;border-radius:14px;box-shadow:0 3px 13px #25395808}.card{padding:23px}.card .num{font-size:31px;font-weight:760;margin:12px 0 6px;color:#193d78}.card .label{font-size:13px;color:#65758b}.card .meta{font-size:12px;color:#76859a}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}.panel{padding:23px}.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel header h2{margin:0}.subtle{font-size:12px;color:#8391a3}.rank{display:flex;gap:12px;align-items:center;margin:14px 0}.rank b{width:25px;color:#8093ab;font-size:13px}.rank .track{flex:1;min-width:0}.rank .name{font-size:13px;margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{height:7px;background:#edf2f8;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#6092d0;border-radius:9px}.count{font-size:13px;font-weight:700;color:#244d86}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}input,select{border:1px solid #cdd6e3;border-radius:8px;padding:11px 12px;background:white;color:#1b2d44;outline:none}input:focus,select:focus{border-color:#497bd0;box-shadow:0 0 0 3px #497bd021}.toolbar input{min-width:250px;flex:1}.toolbar select{max-width:200px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#8190a2;background:#f8fafd;padding:13px 16px}td{padding:15px 16px;font-size:13px;border-top:1px solid #edf1f6;vertical-align:top}td .muted{font-size:12px;color:#8391a3;margin-top:5px}.tag{display:inline-block;background:#eaf2ff;color:#315f9d;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:650}.tag.gray{background:#f1f2f6;color:#68768c}.empty{text-align:center;padding:30px;color:#718099}.wizard{max-width:800px;margin:10px auto}.stepper{display:flex;gap:5px;margin:26px 0}.stepper span{height:5px;background:#dce4ee;border-radius:5px;flex:1}.stepper span.on{background:#3b73be}.wizard .panel{padding:29px}.wizard h2{font-size:21px}.field{margin-top:22px}.field label{font-size:13px;font-weight:700;display:block;margin-bottom:9px}.field select,.field input[type=date]{width:100%}.choice{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:10px;border:1px solid #d3dce9;margin-top:12px}.choice:has(input:checked){border-color:#4476be;background:#f4f8ff}.choice input{margin-top:3px}.choice strong{display:block}.choice small{display:block;color:#718099;margin-top:5px}.choice.disabled{opacity:.47;background:#f5f6f8}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:30px}.controls .right{display:flex;gap:10px}.term-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}.term-box{border:1px solid #dbe3ee;border-radius:10px;padding:12px;min-height:290px;max-height:355px;overflow:auto}.term-box input{width:100%;margin-bottom:10px}.term-row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px 4px;border-bottom:1px solid #f0f2f6;font-size:13px}.term-row button{border:1px solid #cddbf0;background:#edf4ff;color:#28548d;border-radius:7px;width:29px;height:27px}.term-row button.remove{background:#fff2f2;color:#a43838;border-color:#f5cccc}.summary{background:#f6f9fd;border:1px solid #e0e8f2;border-radius:10px;padding:17px;margin-top:16px}.summary dt{font-size:12px;font-weight:700;color:#708099;margin:0 0 5px}.summary dd{margin:0 0 15px;line-height:1.6;overflow-wrap:anywhere}.summary dd:last-child{margin:0}.success{text-align:center;padding:35px 0}.success .symbol{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:#e4f6eb;color:#247749;display:grid;place-items:center;font-size:34px}.footnote{margin-top:24px;text-align:center;font-size:12px;color:#8190a2}.error{color:#b44545;font-size:13px;margin-top:10px}.hidden{display:none!important}@media(max-width:760px){main{padding:23px 15px}.grid{grid-template-columns:repeat(2,1fr)}.panels,.term-cols{grid-template-columns:1fr}.heading{align-items:flex-start}h1{font-size:25px}.wizard .panel{padding:20px}.appbar{padding:15px}.top-pill{display:none}}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:9px}.card{padding:14px}.card .num{font-size:26px}.heading{flex-direction:column}.heading button{align-self:stretch}}
.tree-wrapper{border:1px solid #dce4ef;border-radius:10px;background:#fafcff;padding:12px 14px;max-height:420px;overflow:auto}.tree-branch{margin:3px 0}.tree-branch>summary{cursor:pointer;display:list-item;list-style-position:inside;padding:5px 8px;border-radius:6px;color:#52719d}.tree-branch>summary:hover{background:#edf3fc}.tree-name{display:inline-flex;align-items:center;gap:8px;max-width:calc(100% - 35px);vertical-align:middle}.tree-children{border-left:1px solid #dbe5f2;margin-left:14px;padding-left:17px}.tree-leaf{display:flex;align-items:center;gap:8px;padding:5px 8px;margin-left:3px}.tree-pick{border:none;background:transparent;color:#263d61;font-size:13px;text-align:left;padding:4px 6px;border-radius:6px;line-height:1.35}.tree-pick:hover,.tree-pick:focus-visible{background:#e0ecfd;color:#154c91}.tree-pick.picked{background:#cfe1ff;color:#12417b;font-weight:750}.tree-count{display:inline-block;background:#ebf1f9;border-radius:12px;padding:2px 7px;color:#67809f;font-size:11px;flex-shrink:0}@media(max-width:420px){.tree-wrapper{padding:9px}.tree-children{margin-left:7px;padding-left:9px}}
.selected-term{cursor:grab}.selected-term.dragging{opacity:.45}.selected-term.drag-over{background:#e5efff;outline:2px dashed #6793d2}.term-label{display:flex;align-items:center;gap:5px;min-width:0;overflow-wrap:anywhere;flex:1}.drag-handle{font-size:18px;color:#96a6ba;flex-shrink:0}.order-number{color:#6c7d92;font-weight:700;white-space:nowrap}.reorder-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}.reorder-actions button{width:28px;height:28px;padding:0}.reorder-actions button:disabled{opacity:.25;cursor:not-allowed}.reorder-hint{font-size:12px;margin-top:8px}@media(max-width:500px){.reorder-actions{gap:2px}.reorder-actions button{width:26px}.term-label{font-size:12px}}
</style></head><body><div id="app"></div>
<script>
"use strict";
const STORAGE="poc1-reference-chains-v1";
const extraTerms=["Conditions","Marge de l’appréciation de l’Office","Mesures d'instruction","Motivation des décisions","Objectif","Portée","Notification","Notion","Procédure d’opposition","Procédure de nullité","Recevabilité","Délai de recours","Charge de la preuve","Droits de la défense","Examen d'office","Décision définitive","Appréciation des preuves","Motivation juridique","Protection juridictionnelle","Intérêt à agir","Principes généraux","Contrôle de légalité","Compétence de l'Office","Mesures provisoires","Erreur manifeste","Irrecevabilité","Droits antérieurs","Caractère distinctif","Risque de confusion","Usage sérieux","Opposabilité","Protection des données","Publication","Déchéance","Réexamen","Délai de prescription","Règles de procédure","Recours en annulation","Proportionnalité","Sécurité juridique"];
const state={records:[],view:"dashboard",step:1,base:"",terms:[],date:"",endDate:"1900-01-01",search:"",status:"all",termSearch:"",selectedSearch:"",error:"",lastSaved:null};
const el=document.getElementById("app");
let treePaths=[];
function buildTree(records){const root={name:"",path:"",children:new Map(),count:0};for(const rec of records){const full=rec.full_chain_label||rec.base_chain||"";let current=root;for(const piece of full.split(" - ").filter(Boolean)){if(!current.children.has(piece)){const path=current.path?current.path+" - "+piece:piece;current.children.set(piece,{name:piece,path,children:new Map(),count:0})}current=current.children.get(piece);current.count++}}return root}
function treeMarkup(records,mode){treePaths=[];const tree=buildTree(records);function draw(node,depth){const i=treePaths.push(node.path)-1;const button='<button type="button" class="tree-pick" data-tree-index="'+i+'" title="'+(mode==="wizard"?"Choisir ce niveau":"Afficher cette branche")+'" aria-label="Sélectionner : '+esc(node.path)+'">'+esc(node.name)+'</button>';const badge='<small class="tree-count">'+node.count+'</small>';if(!node.children.size)return '<div class="tree-leaf" data-path-index="'+i+'">'+button+badge+'</div>';return '<details class="tree-branch" '+(depth===0?"open":"")+'><summary><span class="tree-name">'+button+badge+'</span></summary><div class="tree-children">'+[...node.children.values()].sort((a,b)=>a.name.localeCompare(b.name,"fr")).map(c=>draw(c,depth+1)).join("")+'</div></details>'}return '<div class="tree-wrapper">'+[...tree.children.values()].sort((a,b)=>a.name.localeCompare(b.name,"fr")).map(c=>draw(c,0)).join("")+'</div>'}
function filterTree(query){const q=query.trim().toLocaleLowerCase("fr");const wrap=document.querySelector(".tree-wrapper");if(!wrap)return;const nodes=[...wrap.querySelectorAll(".tree-branch,.tree-leaf")];for(const n of nodes){const b=n.classList.contains("tree-leaf")?n.querySelector(":scope > .tree-pick"):n.querySelector(":scope > summary .tree-pick");if(!b)continue;const path=treePaths[Number(b.dataset.treeIndex)]||"";const name=path.toLocaleLowerCase("fr");const matches=!q||name.includes(q)||treePaths.some(p=>p.toLocaleLowerCase("fr").startsWith(name+" - ")&&p.toLocaleLowerCase("fr").includes(q));n.style.display=matches?"":"none";if(q&&matches&&n.classList.contains("tree-branch"))n.open=true}const visible=nodes.some(n=>n.classList.contains("tree-leaf")&&n.style.display!=="none");const msg=document.getElementById("tree-empty");if(msg)msg.hidden=!q||visible;}
function bindTree(mode){document.querySelectorAll(".tree-pick").forEach(b=>{b.onclick=e=>{e.preventDefault();e.stopPropagation();const path=treePaths[Number(b.dataset.treeIndex)];if(mode==="wizard"){state.base=path;state.terms=[];state.error="";document.querySelectorAll(".tree-pick").forEach(x=>x.classList.toggle("picked",x===b));const current=document.getElementById("tree-selection");if(current)current.textContent=path;const error=document.querySelector(".error");if(error)error.remove()}else{state.search=path;dashboard()}}})}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(x){if(!x)return "01/01/1900";const [y,m,d]=x.split("-");return d+"/"+m+"/"+y}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state.records))}catch(e){console.warn("Stockage indisponible",e)}}
async function init(){try{const r=await fetch("./data/chains.json",{cache:"no-store"});if(!r.ok)throw Error("Dataset indisponible");const seed=await r.json();let stored=null;try{stored=JSON.parse(localStorage.getItem(STORAGE))}catch(e){}state.records=Array.isArray(stored)?stored:seed;if(!Array.isArray(stored))save()}catch(e){try{state.records=JSON.parse(localStorage.getItem(STORAGE))||[]}catch(_){}state.error="Les données initiales n’ont pas pu être chargées."}render()}
function stats(arr){const roots=new Set(arr.map(x=>x.root));const terms=new Set(arr.flatMap(x=>x.full_chain_label.split(" - ")));const occurrences={};const termCounts={};arr.forEach(x=>{occurrences[x.base_chain]=(occurrences[x.base_chain]||0)+1;(x.selected_terms||[]).forEach(t=>termCounts[t]=(termCounts[t]||0)+1)});const ranking=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"fr"));const longest=[...arr].sort((a,b)=>b.full_chain_label.split(" - ").length-a.full_chain_label.split(" - ").length||b.full_chain_label.length-a.full_chain_label.length||a.id.localeCompare(b.id)).slice(0,5);return {roots:roots.size,terms:terms.size,longest,topTerms:ranking(termCounts).slice(0,5)}}
function longestHtml(rows){const max=rows[0]?.full_chain_label.split(" - ").length||1;return rows.map((x,i)=>{const n=x.full_chain_label.split(" - ").length;return '<div class="rank"><b>'+String(i+1).padStart(2,"0")+'</b><div class="track"><div class="name" title="'+esc(x.full_chain_label)+'">'+esc(x.full_chain_label)+'</div><div class="bar"><span style="width:'+(n/max*100)+'%"></span></div></div><span class="count">'+n+'</span></div>'}).join("")}
function rankHtml(rows){const max=rows[0]?.[1]||1;return rows.map(([name,n],i)=>'<div class="rank"><b>'+String(i+1).padStart(2,"0")+'</b><div class="track"><div class="name" title="'+esc(name)+'">'+esc(name)+'</div><div class="bar"><span style="width:'+(n/max*100)+'%"></span></div></div><span class="count">'+n+'</span></div>').join("")}
function shell(body){el.innerHTML='<div class="appbar"><div class="brand">Gestion de chaînes de référence<small>PROOF OF CONCEPT · DONNÉES FICTIVES</small></div><span class="top-pill">Environnement de démonstration</span></div><main>'+body+'</main>'}
function dashboard(){const a=state.records,s=stats(a);const filtered=a.filter(x=>{const q=state.search.toLocaleLowerCase("fr");return (!q||[x.full_chain_label,x.id,x.base_chain].join(" ").toLocaleLowerCase("fr").includes(q))&&(state.status==="all"||x.status===state.status)}).sort((a,b)=>b.created_at.localeCompare(a.created_at));shell('<div class="heading"><div><h1>Tableau de bord</h1><p>Vue d’ensemble des chaînes de référence</p></div><button class="btn primary" id="add"><span class="plus">+</span> Nouvelle chaîne</button></div>'+
'<div class="grid"><div class="card"><div class="label">Chaînes enregistrées</div><div class="num">'+a.length+'</div><div class="meta">Ensemble des références</div></div><div class="card"><div class="label">Termes</div><div class="num">'+s.terms+'</div><div class="meta">Termes différents</div></div><div class="card"><div class="label">Chaînes actives</div><div class="num">'+a.filter(x=>x.status==="Active").length+'</div><div class="meta">Statut actif</div></div></div>'+
'<div class="panels"><section class="panel"><header><h2>Longueur des chaînes : Top 5 des plus longues</h2><span class="subtle">Top 5</span></header>'+longestHtml(s.longest)+'</section><section class="panel"><header><h2>Termes les plus fréquents</h2><span class="subtle">Top 5</span></header>'+rankHtml(s.topTerms)+'</section></div>'+
'<section class="panel" style="margin-bottom:18px"><header><h2>Explorer les chaînes par arborescence</h2><span class="subtle">Cliquez sur un niveau pour filtrer</span></header><p style="margin-bottom:12px">Dépliez une catégorie pour explorer ses sous-niveaux. Vous pouvez choisir un niveau, deux, quatre ou davantage.</p>'+treeMarkup(a,"dashboard")+'</section>'+ 
'<section class="panel"><header><h2>Répertoire des chaînes de référence</h2><span class="subtle">'+filtered.length+' résultat(s)</span></header><div class="toolbar"><input id="global-search" placeholder="Rechercher une chaîne, un terme, un identifiant…" value="'+esc(state.search)+'"><select id="status"><option value="all">Tous les statuts</option><option value="Active" '+(state.status==="Active"?"selected":"")+'>Actives</option><option value="Brouillon" '+(state.status==="Brouillon"?"selected":"")+'>Brouillons</option></select><button class="btn sm" id="export">Exporter CSV</button></div><div class="table-wrap"><table><thead><tr><th>Identifiant</th><th>Chaîne de référence</th><th>Date de début</th><th>Date de fin</th><th>Statut</th></tr></thead><tbody>'+filtered.slice(0,100).map(x=>'<tr><td><strong>'+esc(x.id)+'</strong></td><td>'+esc(x.full_chain_label)+'<div class="muted">'+(x.selected_terms||[]).length+' termes ajoutés</div></td><td>'+fmtDate(x.validity_start_date)+'</td><td>'+fmtDate(x.validity_end_date||"1900-01-01")+'</td><td><span class="tag '+(x.status==="Brouillon"?"gray":"")+'">'+esc(x.status)+'</span></td></tr>').join("")+'</tbody></table>'+(filtered.length?"":'<div class="empty">Aucun résultat</div>')+'</div></section><div class="footnote">Prototype de démonstration. Les données ajoutées sont enregistrées localement dans ce navigateur.</div>');bindTree("dashboard");document.getElementById("add").onclick=()=>{state.view="wizard";state.step=1;state.base="";state.terms=[];state.date="";state.endDate="1900-01-01";state.error="";render()};document.getElementById("global-search").oninput=e=>{const pos=e.target.selectionStart;state.search=e.target.value;dashboard();const n=document.getElementById("global-search");n.focus();n.setSelectionRange(pos,pos)};document.getElementById("status").onchange=e=>{state.status=e.target.value;dashboard()};document.getElementById("export").onclick=exportCSV}
function exportCSV(){const cols=["id","root","base_chain","selected_terms","full_chain_label","validity_start_date","validity_end_date","created_at","status"];const csv=[cols.join(";"),...state.records.map(x=>cols.map(k=>'"'+String(k==="selected_terms"?(x[k]||[]).join(" | "):x[k]??"").replaceAll('"','""')+'"').join(";"))].join("\r\n");const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="chaines-reference-poc1.csv";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function wizard(){const titles=["Type de création","Sélection de la chaîne de base","Sélection des termes","Vérifiez et validez","Sauvegarde"];const body='<button class="btn sm" id="quit">← Tableau de bord</button><div class="wizard"><h1>Créer une chaîne de référence</h1><p>Étape '+state.step+' sur 5 · '+titles[state.step-1]+'</p><div class="stepper">'+titles.map((x,i)=>'<span class="'+(i<state.step?"on":"")+'" title="'+esc(x)+'"></span>').join("")+'</div><section class="panel"><h2>'+titles[state.step-1]+'</h2>'+stepBody()+'</section><div class="footnote">Toutes les données sont fictives. Cette démonstration ne modifie aucun système institutionnel.</div></div>';shell(body);document.getElementById("quit").onclick=()=>{state.view="dashboard";render()};bindStep()}
function buttons(last){return '<div class="controls"><button class="btn" id="back">'+(state.step===1?"Annuler":"Précédent")+'</button><div class="right"><button class="btn primary" id="next">'+last+'</button></div></div>'}
function stepBody(){if(state.step===1)return '<p>Choisissez une méthode de création.</p><label class="choice disabled"><input type="radio" disabled name="mode"><span><strong>À partir d’un terme de niveau 1</strong><small>Fonctionnalité à venir</small></span></label><label class="choice"><input type="radio" checked name="mode"><span><strong>À partir d’une chaîne de référence existante</strong><small>Créer une nouvelle chaîne en ajoutant des termes à une chaîne de base.</small></span></label>'+buttons("Suivant");
if(state.step===2){return '<p>Choisissez un nœud dans l’arbre, quel que soit son niveau. </p><div class="field"><label for="tree-search">Rechercher ou écrire une chaîne de référence</label><input type="search" id="tree-search" placeholder="Ex. Aides d’État, Conditions, Portée…" autocomplete="off" style="width:100%"></div><div class="field"><label>Arborescence des chaînes de référence</label>'+treeMarkup(state.records,"wizard")+'<p id="tree-empty" class="empty" hidden>Aucune chaîne ne correspond à cette recherche.</p></div><div class="summary"><dt>Niveau sélectionné</dt><dd id="tree-selection">'+esc(state.base||"Aucune sélection") +'</dd></div>'+err()+buttons("Suivant")}
if(state.step===3){const available=extraTerms.filter(x=>!state.terms.includes(x)&&x.toLocaleLowerCase("fr").includes(state.termSearch.toLocaleLowerCase("fr")));const chosen=state.terms.filter(x=>x.toLocaleLowerCase("fr").includes(state.selectedSearch.toLocaleLowerCase("fr")));return '<p>Ajoutez les termes dans l’ordre souhaité. La chaîne finale reprend la chaîne de base sélectionnée.</p><div class="summary"><dt>Chaîne de référence</dt><dd>'+esc(state.base)+'</dd></div><div class="field"><label for="date">Date début validité</label><input type="date" id="date" value="'+esc(state.date)+'"></div><div class="field"><label for="end-date">Date de fin (01/01/1900 si non définie)</label><input type="date" id="end-date" value="'+esc(state.endDate||"1900-01-01")+'"></div><div class="term-cols"><div><h3>Termes disponibles</h3><input id="term-search" placeholder="Rechercher…" value="'+esc(state.termSearch)+'"><div class="term-box">'+available.map(t=>'<div class="term-row"><span>'+esc(t)+'</span><button data-add="'+esc(t)+'" title="Ajouter">+</button></div>').join("")+(available.length?"":'<p>Aucun terme disponible</p>')+'</div></div><div><h3>Termes sélectionnés ('+state.terms.length+')</h3><input id="chosen-search" placeholder="Rechercher…" value="'+esc(state.selectedSearch)+'"><div class="term-box">'+chosen.map((t)=>{const idx=state.terms.indexOf(t);return '<div class="term-row selected-term" draggable="true" data-term-index="'+idx+'"><span class="term-label"><span class="drag-handle" aria-hidden="true">⠿</span><span class="order-number">'+(idx+1)+'.</span> '+esc(t)+'</span><div class="reorder-actions"><button class="move-btn" data-move-up="'+idx+'" title="Monter ce terme" aria-label="Monter '+esc(t)+'" '+(idx===0?"disabled":"")+'>↑</button><button class="move-btn" data-move-down="'+idx+'" title="Descendre ce terme" aria-label="Descendre '+esc(t)+'" '+(idx===state.terms.length-1?"disabled":"")+'>↓</button><button class="remove" data-remove="'+esc(t)+'" title="Retirer '+esc(t)+'" aria-label="Retirer '+esc(t)+'">×</button></div></div>'}).join("")+(chosen.length?"":'<p>Aucun terme sélectionné</p>')+'</div><p class="reorder-hint">Glissez-déposez les termes ou utilisez ↑ et ↓ pour changer leur ordre.</p></div></div>'+err()+buttons("Suivant")}
if(state.step===4||state.step===5){const full=state.base+(state.terms.length?" - "+state.terms.join(" - "):"");return '<p>'+(state.step===4?"Vérifiez les éléments de la nouvelle chaîne et validez.":"Confirmez la sauvegarde dans le répertoire.")+'</p><dl class="summary"><dt>Chaîne de référence</dt><dd>'+esc(full)+'</dd><dt>Date de début</dt><dd>'+fmtDate(state.date)+'</dd><dt>Date de fin</dt><dd>'+fmtDate(state.endDate||"1900-01-01")+'</dd><dt>Liste des termes</dt><dd><ol style="padding-left:20px;margin:5px 0">'+state.base.split(" - ").concat(state.terms).map(t=>'<li>'+esc(t)+'</li>').join("")+'</ol></dd></dl>'+buttons(state.step===4?"Valider":"Sauvegarder")}}
function err(){return state.error?'<p class="error" role="alert">'+esc(state.error)+'</p>':""}
function bindStep(){document.getElementById("back").onclick=()=>{state.error="";if(state.step===1){state.view="dashboard"}else{state.step--}render()};document.getElementById("next").onclick=next;if(state.step===2){bindTree("wizard");document.getElementById("tree-search").oninput=e=>filterTree(e.target.value);}if(state.step===3){document.getElementById("date").onchange=e=>state.date=e.target.value;document.getElementById("end-date").onchange=e=>state.endDate=e.target.value||"1900-01-01";document.getElementById("term-search").oninput=e=>{state.termSearch=e.target.value;wizard();document.getElementById("term-search").focus()};document.getElementById("chosen-search").oninput=e=>{state.selectedSearch=e.target.value;wizard();document.getElementById("chosen-search").focus()};document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{if(!state.terms.includes(b.dataset.add))state.terms.push(b.dataset.add);state.error="";wizard()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{state.terms=state.terms.filter(t=>t!==b.dataset.remove);wizard()});function moveTerm(from,to){if(from<0||to<0||from>=state.terms.length||to>=state.terms.length||from===to)return;const term=state.terms.splice(from,1)[0];state.terms.splice(to,0,term);wizard()}document.querySelectorAll("[data-move-up]").forEach(b=>b.onclick=()=>moveTerm(Number(b.dataset.moveUp),Number(b.dataset.moveUp)-1));document.querySelectorAll("[data-move-down]").forEach(b=>b.onclick=()=>moveTerm(Number(b.dataset.moveDown),Number(b.dataset.moveDown)+1));let dragFrom=null;document.querySelectorAll(".selected-term").forEach(row=>{row.addEventListener("dragstart",e=>{dragFrom=Number(row.dataset.termIndex);row.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(dragFrom))});row.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";row.classList.add("drag-over")});row.addEventListener("dragleave",()=>row.classList.remove("drag-over"));row.addEventListener("drop",e=>{e.preventDefault();const from=dragFrom;dragFrom=null;moveTerm(from,Number(row.dataset.termIndex))});row.addEventListener("dragend",()=>{dragFrom=null;document.querySelectorAll(".selected-term").forEach(x=>x.classList.remove("dragging","drag-over"))})})}}
function next(){state.error="";if(state.step===2&&!state.base){state.error="Veuillez sélectionner une chaîne de base.";return render()}if(state.step===3){state.date=document.getElementById("date").value;state.endDate=document.getElementById("end-date").value||"1900-01-01";if(!state.date){state.error="Veuillez renseigner la date de début de validité.";return render()}if(!state.terms.length){state.error="Veuillez sélectionner au moins un terme.";return render()}}if(state.step===5)return commit();state.step++;render()}
function commit(){const last=Math.max(0,...state.records.map(r=>Number(String(r.id).replace("REF-",""))||0));const root=state.base.split(" - ")[0];const item={id:"REF-"+String(last+1).padStart(4,"0"),root,base_chain:state.base,selected_terms:[...state.terms],full_chain_label:state.base+" - "+state.terms.join(" - "),validity_start_date:state.date,validity_end_date:state.endDate||"1900-01-01",created_at:new Date().toISOString(),status:"Active"};state.records.push(item);save();state.lastSaved=item;state.view="success";render()}
function success(){shell('<div class="wizard"><section class="panel success"><div class="symbol">✓</div><h1>Chaîne sauvegardée</h1><p>La chaîne <strong>'+esc(state.lastSaved.id)+'</strong> a été ajoutée aux données de démonstration.</p><div class="summary" style="text-align:left">'+esc(state.lastSaved.full_chain_label)+'</div><button class="btn primary" id="home" style="margin-top:28px">Revenir au tableau de bord</button></section></div>');document.getElementById("home").onclick=()=>{state.view="dashboard";state.search="";state.status="all";render()}}
function render(){if(state.view==="dashboard")dashboard();else if(state.view==="success")success();else wizard()}
init();
</script></body></html>
