if(state.step===4||state.step===5){const full=state.base+(state.terms.length?" - "+state.terms.join(" - "):"");return '<p>'+(state.step===4?"Vérifiez les éléments de la nouvelle chaîne et validez.":"Confirmez la sauvegarde dans le répertoire des chaînes de référence.")+'</p><dl class="summary"><dt>Chaîne de référence</dt><dd>'+esc(full)+'</dd><dt>Date de début</dt><dd>'+fmtDate(state.date)+'</dd><dt>Date de fin</dt><dd>'+fmtDate(state.endDate||"3000-12-31")+'</dd><dt>Liste des termes</dt><dd><ol style="padding-left:20px;margin:5px 0">'+state.base.split(" - ").concat(state.terms).map(t=>'<li>'+esc(t)+'</li>').join("")+'</ol></dd></dl>'+buttons(state.step===4?"Valider":"Sauvegarder")}}

function bindStep(){document.getElementById("back").onclick=()=>{state.error="";if(state.step===2){state.view="dashboard"}else{state.step--}render()};document.getElementById("next").onclick=next;if(state.step===2){bindTree("wizard")}if(state.step===3){bindDateInput("date",value=>state.date=value);bindDateInput("end-date",value=>state.endDate=value);document.querySelectorAll("#new-types input").forEach(el=>el.onchange=()=>{state.typesIndexation=[...document.querySelectorAll("#new-types input:checked")].map(x=>x.value)});document.getElementById("term-search").oninput=e=>{state.termSearch=e.target.value;wizard();document.getElementById("term-search").focus()};document.getElementById("chosen-search").oninput=e=>{state.selectedSearch=e.target.value;wizard();document.getElementById("chosen-search").focus()};document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{if(!state.terms.includes(b.dataset.add))state.terms.push(b.dataset.add);state.error="";wizard()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{state.terms=state.terms.filter(t=>t!==b.dataset.remove);wizard()});function moveTerm(from,to){if(from<0||to<0||from>=state.terms.length||to>=state.terms.length||from===to)return;const term=state.terms.splice(from,1)[0];state.terms.splice(to,0,term);wizard()}document.querySelectorAll("[data-move-up]").forEach(b=>b.onclick=()=>moveTerm(Number(b.dataset.moveUp),Number(b.dataset.moveUp)-1));document.querySelectorAll("[data-move-down]").forEach(b=>b.onclick=()=>moveTerm(Number(b.dataset.moveDown),Number(b.dataset.moveDown)+1));let dragFrom=null;document.querySelectorAll(".selected-term").forEach(row=>{row.addEventListener("dragstart",e=>{dragFrom=Number(row.dataset.termIndex);row.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(dragFrom))});row.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";row.classList.add("drag-over")});row.addEventListener("dragleave",()=>row.classList.remove("drag-over"));row.addEventListener("drop",e=>{e.preventDefault();const from=dragFrom;dragFrom=null;moveTerm(from,Number(row.dataset.termIndex))});row.addEventListener("dragend",()=>{dragFrom=null;document.querySelectorAll(".selected-term").forEach(x=>x.classList.remove("dragging","drag-over"))})})}}
function next(){state.error="";if(state.step===2&&!state.base){state.error="Veuillez sélectionner une chaîne de base.";return render()}if(state.step===3){state.date=readDateInput("date");state.endDate=readDateInput("end-date");if(!state.date||!state.endDate){state.error="Saisissez des dates valides au format JJ/MM/AAAA.";return render()}if(state.date>state.endDate){state.error="La date de fin doit être postérieure ou égale à la date de début.";return render()}if(!state.date){state.error="Veuillez renseigner la date de début de validité.";return render()}if(!state.terms.length){state.error="Veuillez sélectionner au moins un terme.";return render()}}if(state.step===5)return commit();state.step++;render()}
function commit(){
 const full=state.base+" - "+state.terms.join(" - ");
 if(state.records.some(x=>x.full_chain_label===full)){state.error="Cette chaîne existe déjà.";state.step=4;render();return}
 const next=Math.max(0,...state.records.map(x=>Number((String(x.id).match(/^REF-(\d+)$/)||[])[1])||0));
 const item={id:"REF-"+String(next+1).padStart(4,"0"),root:state.base.split(" - ")[0],base_chain:state.base,selected_terms:[...state.terms],full_chain_label:full,validity_start_date:state.date||"1900-01-01",validity_end_date:state.endDate||"3000-12-31",types_indexation:[...state.typesIndexation],created_at:new Date().toISOString(),status:"EC",local_only:true};
 state.records.push(item);
 if(!save()){state.records.pop();state.error="Enregistrement local impossible : stockage du navigateur indisponible.";state.step=4;render();return}
 state.lastSaved=item;state.view="success";render()
}
function success(){shell('<div class="wizard"><section class="panel success"><div class="symbol">✓</div><h1>Chaîne sauvegardée</h1><p>La chaîne <strong>'+esc(state.lastSaved.id)+'</strong> a été enregistrée. Elle est disponible dans le répertoire, l’arborescence et le graphe. Les statistiques seront recalculées à l’ouverture du tableau de bord.</p><div class="summary" style="text-align:left">'+esc(state.lastSaved.full_chain_label)+'</div><p style="font-size:12px;margin-top:16px">Mode démonstration : les modifications ne sont pas partagées avec d’autres appareils. Aucune demande GitHub n’est nécessaire.</p><button class="btn primary" id="home" style="margin-top:24px">Revenir au tableau de bord</button></section></div>');document.getElementById("home").onclick=()=>{state.view="dashboard";state.search="";state.status="all";render()}}
function translateUI(){document.documentElement.lang=uiLang;const dict=I18N_TRANSLATIONS[uiLang]||{};const root=document.getElementById("app");const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){if(n.parentElement?.closest(".tree-wrapper,.term-row,.summary dd,tbody"))continue;const value=n.nodeValue;const trimmed=value.trim();const match=/^Termes sélectionnés \((\d+)\)$/.exec(trimmed);if(match&&dict["Termes sélectionnés"]){n.nodeValue=value.replace(trimmed,dict["Termes sélectionnés"]+" ("+match[1]+")");continue}if(dict[trimmed])n.nodeValue=value.replace(trimmed,dict[trimmed])}for(const input of root.querySelectorAll("input[placeholder]")){const value=input.getAttribute("placeholder");if(dict[value])input.setAttribute("placeholder",dict[value])}const stepNames={bg:["Стъпка","от"],cs:["Krok","z"],da:["Trin","af"],de:["Schritt","von"],el:["Βήμα","από"],en:["Step","of"],es:["Paso","de"],et:["Samm","/"],fi:["Vaihe","/"],ga:["Céim","as"],hr:["Korak","od"],hu:["Lépés","/"],it:["Passaggio","di"],lt:["Žingsnis","iš"],lv:["Solis","no"],mt:["Pass","minn"],nl:["Stap","van"],pl:["Krok","z"],pt:["Passo","de"],ro:["Pasul","din"],sk:["Krok","z"],sl:["Korak","od"],sv:["Steg","av"]};const heading=root.querySelector(".wizard > p");if(heading){const match=/^Étape (\\d+) sur 5 · (.*)$/.exec(heading.textContent);if(match&&stepNames[uiLang])heading.textContent=stepNames[uiLang][0]+" "+match[1]+" "+stepNames[uiLang][1]+" 5 · "+(dict[match[2]]||match[2])}}
const originalDashboard=dashboard;dashboard=function(){originalDashboard();translateUI()};
const originalWizard=wizard;wizard=function(){originalWizard();translateUI()};
const originalSuccess=success;success=function(){originalSuccess();translateUI()};
function render(){if(state.view==="dashboard")dashboard();else if(state.view==="success")success();else wizard()}
init();
</script></body></html>
